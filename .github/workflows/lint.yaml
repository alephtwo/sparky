---
name: "Lint"
on:
  push:
    branches-ignore:
      - "main"
  workflow_call:
jobs:
  linter:
    name: "Run JS Linter"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "pnpm/action-setup/@v5"
        with:
          version: "latest"
      - uses: "actions/setup-node@v6"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Generate Dependencies"
        run: "pnpm generate"
      - name: "Run linter"
        run: "pnpm lint:ts"
  oxfmt:
    name: "Run oxfmt"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "pnpm/action-setup/@v5"
        with:
          version: "latest"
      - uses: "actions/setup-node@v6"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Run oxfmt"
        run: "pnpm oxfmt"
  markdown:
    name: "Run Markdown Linter"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "pnpm/action-setup/@v5"
        with:
          version: "latest"
      - uses: "actions/setup-node@v6"
        with:
          node-version: "lts/krypton"
          cache: "pnpm"
      - name: "Install Dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Run markdown linting"
        run: "pnpm lint:md"
  yaml:
    name: "Lint YAML"
    runs-on: "ubuntu-latest"
    container:
      image: "alpine:latest"
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install yamllint"
        run: "apk add yamllint"
      - name: "Run yamllint"
        run: "yamllint -s ."
